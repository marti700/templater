<script>

    }

    const repeatEndIdx = article.indexOf('<', article.indexOf(']]]'))

    if (article[repeatEndIdx + 1] == '/') {

      let missing = article.substring(article.indexOf(']]]') + 3, article.indexOf('>', repeatEndIdx) + 1);
      console.log(missing);
      // fixedString = fixedString + fixedString.substring(article.indexOf(']]]')+3, article.indexOf('>', repeatEndIdx)+1);
      // repeatString = repeatString + missing;

    article = article.replace('[repeat[[', '');

    console.log(replaceIndexStart);

  function insertButton() {
    // article = article.replace(repeatString, `<div><button onclick="this.parentElement.innerHTML = '${repeatString.replace(/'/g, "\\'")}';">Agregar</button></div>`);

    let documentContainer = document.getElementsByTagName("article")[0]
    let mutatedDoc = documentContainer.innerHTML;
    let repeatString = fixedString();

    if (repeatString != '') {
      mutatedDoc = mutatedDoc.replace('[repeat[[', '');
      mutatedDoc = mutatedDoc.replace(']]]', '');
      let buttonHtml = `<div id='a-${repeatedID}'><button onclick="replaceHTML('a-${repeatedID}')">Agregar</button></div>`
      repString[repeatedID] = `<div> ${repeatString} </div> ${buttonHtml}`;
      repeatedID++;
      // return mutatedDoc.replaceAll(repeatString, `<div><button id='a1' onclick="replaceHTML('a1')">Agregar</button></div>`);
      documentContainer.innerHTML = mutatedDoc.replaceAll(repeatString, buttonHtml);
    }
  }

  function replaceHTML(elementId) {
    let idx = elementId.split('-')[1];
    elem = document.getElementById(elementId);
    elem.outerHTML = replaceCurlyBracesWithFormControls(repString[idx])
  }
  /// =========================
  /// BUTTON KUNG-FU END
  /// =========================


  /// ==================================
  /// FORM CONTROLS DOM INSERTION START
  /// ==================================

  /**
   * Replaces placeholders within an HTML string with form controls (input or select).
   *
   * @param {string} htmlString The HTML string containing placeholders in the format `{fieldName:inputType;attribute1=value1;...}`.
   * @param {object} [json] An optional JSON object containing data to populate the form fields. If provided, the value of the fieldName will be taken from the json object, if it exists.
   * @returns {string} The HTML string with form controls inserted in place of the placeholders.
   *
   * @example
   * const html = `<div>{name:input}, {age:input;required=true}, {city:drop;New York;Los Angeles;Chicago}</div>`;
   * const data = { name: "John Doe", age: "30" };
   * const newHtml = replaceCurlyBracesWithFormControls(html, data);
   * // newHtml will be:
   * // `<div><input type="text" name="name" value="John Doe">, <input type="text" name="age" required="true" value="30">, <select name="city"><option value="New York">New York</option><option value="Los Angeles">Los Angeles</option><option value="Chicago">Chicago</option></select></div>`
   */
  function replaceCurlyBracesWithFormControls(htmlString, json) {
    // Create a temporary div element to parse the HTML string
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = htmlString;

    // Select all elements within the temporary div
    const elementsWithCurlyBraces = tempDiv.querySelectorAll('*');

    // Iterate over each element
    elementsWithCurlyBraces.forEach(element => {
      // Get all text nodes within the current element
      const textNodes = Array.from(element.childNodes).filter(node => node.nodeType === Node.TEXT_NODE);

      // Iterate over each text node within the element
      textNodes.forEach(textNode => {
        let text = textNode.textContent; // Get the text content of the node
        let newNodes = []; // Array to store the new nodes (text and form controls)
        let currentIndex = 0; // Keep track of the current parsing position within the text

        // Regular expression to find placeholders in the format {fieldName:inputType;attribute1=value1;...}
        const regex = /\{([^:]+):(input|drop);?([^}]*)\}/g;
        let match;

        // Loop through all matches found in the text node
        while ((match = regex.exec(text)) !== null) {
          const fullMatch = match[0]; // The entire matched placeholder string
          const fieldName = match[1]; // The name of the field
          const inputType = match[2]; // The type of input (input or drop)
          const attributesString = match[3]; // The string containing attributes (e.g., required=true;class=my-class)
          let attributes = {}; // Object to store the attributes

          // Parse the attributes string into key-value pairs
          if (attributesString) {
            const attributePairs = attributesString.split(';');
            attributePairs.forEach(pair => {
              const [key, value] = pair.split('=');
              if (key && value) {
                attributes[key.trim()] = value.trim();
              }
            });
          }

          // Add the text before the match to the newNodes array
          newNodes.push(document.createTextNode(text.substring(currentIndex, match.index)));

          let inputElement;
          // Create the appropriate form control element based on the inputType
          if (inputType === "input") {
            inputElement = document.createElement('input');
            inputElement.type = 'text';
            inputElement.name = fieldName;
            // if (json) { // If JSON data is provided

            //   inputElement.value = json[fieldName] || ""; // Set the value from the JSON data, or an empty string if not found
            // }
            // Set the attributes on the input element
            for (const key in attributes) {
              inputElement.setAttribute(key, attributes[key]);
            }
          } else if (inputType === "drop") {
            inputElement = document.createElement('select');
            inputElement.name = fieldName;
            const options = attributesString.split(';'); // Split the attributes string into options
            options.forEach(optionText => {
              const option = document.createElement('option');
              option.value = optionText;
              option.text = optionText;
              inputElement.appendChild(option);
            });
          }
          newNodes.push(inputElement); // Add the form control to the newNodes array
          currentIndex = match.index + fullMatch.length; // Update the current parsing position
        }

        // Add the remaining text after the last match to the newNodes array
        newNodes.push(document.createTextNode(text.substring(currentIndex)));

        // Replace the original text node with the new nodes (text and form controls) in one operation
        textNode.replaceWith(...newNodes);
      });
    });

    return tempDiv.innerHTML; // Return the modified HTML string
  }

  /// ==================================
  /// FORM CONTROLS DOM INSERTION END
  /// ==================================

  /// =================================
  // SEND DOCUMENT TO THE SERVER START
  /// =================================
  function requestDocumentgeneration() {
    const container = document.getElementsByTagName('article')[0];

    if (container) {
      const htmlContent = container.outerHTML;
      console.log(htmlContent);

      const params = new URLSearchParams();
      // TODO: Check that all form fields have values, throw an error if that's not the case
      params.append('html', replaceFormValues());

      fetch('/document/generate', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: params,
      })
        .then(response => {
          if (response.ok) {
          }
        })
        .then(data => {
          console.log('Success:', data);
        })
        .catch((error) => {
          console.error('Error:', error);
          alert("An error occurred while saving the template."); // Alert user on error
        });
    } else {
      console.error("Element not found!");
    }
  }

  /// =================================
  // SEND DOCUMENT TO THE SERVER END
  /// =================================


  /**
   * Replaces form controls within an HTML string with their corresponding values.
   *
   * This function takes the HTML content of an article element, clones it to avoid
   * modifying the original DOM, and then iterates through all form elements (input,
   * select, textarea) within the cloned article.  It extracts the current value
   * of each form element and replaces the element itself with a text node containing
   * the value.  If a form element has no value, it is removed.
   *
   * @returns {string} The modified HTML string with form controls replaced by their values.
   *                   Returns the innerHTML of the modified article element.
   *
   * @example
   * // Assuming you have an article element with id "myArticle"
   * const originalHtml = document.getElementById('myArticle').innerHTML;
   * const newHtml = replaceFormValues(); // No need to pass the HTML string anymore.
   * document.getElementById('myArticle').innerHTML = newHtml; // Update the original element
   *
   * // Example HTML (before):
   * // <article>
   * //   <input type="text" value="Initial Text">
   * //   <select>...</select>
   * // </article>
   *
   * // Example HTML (after, assuming the text input was changed to "New Text" and a select option was chosen):
   * // <article>
   * //   New Text
   * //   [Selected Option Value]
   * // </article>
   */
  function replaceFormValues() {
    // clone the article to not modify the original HTML
    let art = document.getElementsByTagName('article')[0].cloneNode(true);

    const formElements = art.querySelectorAll('input, select, textarea');
    console.log(formElements);

    formElements.forEach(element => {
      const tagName = element.tagName.toLowerCase();
      let value = '';

      switch (tagName) {
        case 'input':
          const type = element.type.toLowerCase();
          if (type === 'text') {
            value = element.value;
          } else if (type === 'radio' || type === 'checkbox') {
            value = element.checked ? element.value : ''; // Handle checked state
          }
          break;
        case 'select':
          value = element.options[element.selectedIndex]?.value || ''; // Safe navigation for selected option
          break;
        case 'textarea':
          value = element.value;
          break;
      }

      // Replace the element with its value in the HTML string.
      if (value) {
        const placeholder = document.createTextNode(value);
        element.replaceWith(placeholder);
      } else {
        element.remove(); // if no value remove the element
      }
    });

    return art.outerHTML;
  }

  setTimeout(() => {
    insertButton(); // insert the button for the repeat text
    document.body.innerHTML = replaceCurlyBracesWithFormControls(document.body.innerHTML);
  }, 50);

</script>
