  /**
 * Finds and extracts repeated strings from the given HTML content.
 *
 * This function recursively scans the HTML content for strings enclosed in
 * `[repeat[[...]]]` tags, extracts them, and returns an array of these strings.
 *
 * @param {string} article The HTML content to scan.
 * @param {number} idx The starting index for the search.
 * @param {Array<string>} repeatedStrings An array to store the extracted strings.
 * @returns {Array<string>} An array of extracted repeated strings.
 */
  function fixedStrings(article, idx, repeatedStrings) {
    console.log("Bien;;");
    // Find the starting index of the next [repeat[[ tag.
    let repeatStart = article.indexOf('[repeat[[', idx);

    // If no more [repeat[[ tags are found, return the array of extracted strings.
    if (repeatStart == -1) {
      return repeatedStrings;
    }

    // Find the ending index of the corresponding ]]] tag.
    let repeatEnd = article.indexOf(']]]', idx);
    // Extract the repeated string.
    let repeatString = article.substring(repeatStart + 9, repeatEnd);

    // Handle cases where the repeated string starts with a closing tag.
    if (repeatString.indexOf("</") == 0) {
      let closingTag = repeatString.indexOf(">");
      repeatString = repeatString.substring(closingTag + 1);
    }

    // Find the index of the next opening tag after the ]]] tag.
    const repeatEndIdx = article.indexOf('<', article.indexOf(']]]', idx));

    // Handle cases where there is a missing tag in the repeated string.
    if (article[repeatEndIdx + 1] == '/') {
      console.log(repeatEndIdx);
      console.log(repeatString);
      let missing = article.substring(article.indexOf(']]]', idx) + 3, article.indexOf('>', repeatEndIdx) + 1);
      console.log(missing);
      console.log(repeatString);
    }

    // Remove the [repeat[[ and ]]] tags from the article.
    article = article.replace('[repeat[[', '');
    article = article.replace(']]]', '');

    // Log the extracted string and its starting index.
    const replaceIndexStart = article.indexOf(repeatString);
    console.log(replaceIndexStart);
    console.log('============');
    console.log(repeatString);
    console.log('============');

    // Add the extracted string to the array.
    repeatedStrings.push(repeatString);
    // Recursively call the function to find more repeated strings.
    return fixedStrings(article, repeatEndIdx, repeatedStrings);
  }

  /**
  * Inserts "Agregar" buttons into the document based on repeated string patterns.
  *
  * This function scans the content of the first `<article>` element for repeated string
  * patterns enclosed in `[repeat[[...]]]` tags. For each repeated string, it:
  * 1. Extracts the string and stores it in the `repString` object.
  * 2. Replaces the repeated string in the document with an "Agregar" button.
  * 3. Uses an Immediately Invoked Function Expression (IIFE) to create a closure,
  * ensuring each button's `onclick` handler has access to its unique ID.
  */
  function insertButton() {
    // Get the first <article> element in the document.
    let documentContainer = document.getElementsByTagName("article")[0];
    // Get the inner HTML of the <article> element.
    let mutatedDoc = documentContainer.innerHTML;
    // Find and extract all repeated strings from the document.
    let repeatStrings = fixedStrings(mutatedDoc, 0, []);

    // Iterate over each extracted repeated string.
    repeatStrings.forEach(element => {
      // Remove the [repeat[[ and ]]] tags from the document.
      mutatedDoc = mutatedDoc.replace('[repeat[[', '');
      mutatedDoc = mutatedDoc.replace(']]]', '');

      // Use an IIFE to create a closure for each "Agregar" button.
      const buttonHtml = (function (uniqueId) {
        // Return the HTML for the "Agregar" button, with a unique ID and onclick handler.
        return `<span name="dummy" id='a-${uniqueId}'><button onclick="openCustomerSelectionModal('a-${uniqueId}')">Agregar</button></span>`;
      })(repeatedID); // Pass the unique ID to the IIFE

      // Store the repeated string in the repString object, using the unique ID as the key.
      repString[repeatedID] = `${element}`;
      // Increment the repeatedID counter.
      repeatedID++;
      // Replace all occurrences of the repeated string in the document with the "Agregar" button.
      mutatedDoc = mutatedDoc.replaceAll(element, buttonHtml);
      console.log("bien");
    });

    // Update the inner HTML of the <article> element with the modified content.
    documentContainer.innerHTML = mutatedDoc;
  }

  /**
    * Replaces placeholders within an HTML string with form controls (input, select, buttton).
    *
    * @param {string} htmlString The HTML string containing placeholders in the format `{fieldName:inputType;attribute1=value1;...}`.
    * @param {object} [json] An optional JSON object containing data to populate the form fields. If provided, the value of the fieldName will be taken from the json object, if it exists.
    * @returns {string} The HTML string with form controls inserted in place of the placeholders.
    *
    * @example
    * const html = `<div>{name:input}, {age:input;required=true}, {city:drop;New York;Los Angeles;Chicago}</div>`;
    * const data = { name: "John Doe", age: "30" };
    * const newHtml = replaceCurlyBracesWithFormControls(html, data);
    * // newHtml will be:
    * // `<div><input type="text" name="name" value="John Doe">, <input type="text" name="age" required="true" value="30">, <select name="city"><option value="New York">New York</option><option value="Los Angeles">Los Angeles</option><option value="Chicago">Chicago</option></select></div>`
    */
  function replaceCurlyBracesWithFormControls(htmlString, json) {
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = htmlString;

    const elementsWithPlaceholders = tempDiv.querySelectorAll('*');

    elementsWithPlaceholders.forEach(element => {
      Array.from(element.childNodes).filter(node => node.nodeType === Node.TEXT_NODE).forEach(textNode => {
        let text = textNode.textContent;
        let newNodes = [];
        let currentIndex = 0;

        // Regular expression to find both form control placeholders and signature reference placeholders
        const regex = /\{([^:]+):(button|input|drop);?([^}]*)\}|\{(signatureref)\}/g;
        let match;

        while ((match = regex.exec(text)) !== null) {
          const fullMatch = match[0];
          const formControlFieldName = match[1];
          const inputType = match[2];
          const attributesString = match[3];
          const signatureRef = match[4]// Captures either signatureref1 or signatureref2

          newNodes.push(document.createTextNode(text.substring(currentIndex, match.index)));

          if (signatureRef) {
            // Create an empty div for signature references
            const signatureDiv = document.createElement('div');
            signatureDiv.id = signatureRef; // Set the ID to identify it later
            newNodes.push(signatureDiv);
          } else if (inputType) {
            let inputElement;
            if (inputType === "input") {
              inputElement = document.createElement('input');
              inputElement.type = 'text';
              inputElement.name = formControlFieldName;
              if (json) {
                if (formControlFieldName.includes("Name")) {
                  const fullName = json["Name"] + " " + json["LastName"];
                  inputElement.value = fullName;
                } else {
                  inputElement.value = json[formControlFieldName] || "";
                }
              }
              if (attributesString) {
                attributesString.split(';').forEach(pair => {
                  const [key, value] = pair.split('=');
                  if (key && value) {
                    inputElement.setAttribute(key.trim(), value.trim());
                  }
                });
              }
            } else if (inputType === "drop") {
              inputElement = document.createElement('select');
              inputElement.name = formControlFieldName;
              if (attributesString) {
                attributesString.split(';').forEach(optionText => {
                  const option = document.createElement('option');
                  option.value = optionText;
                  option.text = optionText;
                  inputElement.appendChild(option);
                });
              }
            } else if (inputType === "button") {
              inputElement = document.createElement('button');
              inputElement.textContent = "Generar firmas";
              inputElement.id = 'signatures';
            }
            newNodes.push(inputElement);
          }
          currentIndex = match.index + fullMatch.length;
        }
        newNodes.push(document.createTextNode(text.substring(currentIndex)));
        textNode.replaceWith(...newNodes);
      });
    });

    return tempDiv;
  }


  function handleSignatureButtonClick(elementid) {
    // Get the first <article> element in the document, which serves as the container for input fields.
    let container = document.getElementsByTagName('article')[0];

    // Get the parent node of the clicked button.
    let buttonParentNode = document.getElementById(elementid).parentNode.parentNode;

    // Check if buttonParentNode exists
    if (!buttonParentNode) {
      console.error(`Element with id ${elementid} not found.`);
      return; // Exit the function if the element is not found
    }

    // Select all input elements within the container whose 'name' attribute starts with "Name".
    const nameInputs = Array.from(container.querySelectorAll('input[name^="Name"]'));

    // Select all input elements within the container whose 'name' attribute starts with "role".
    const roleInputs = Array.from(container.querySelectorAll('input[name^="role"]'));

    // Group name input values by their numerical index (extracted from the 'name' attribute).
    const nameGroups = {};
    nameInputs.forEach(input => {
      const index = parseInt(input.name.replace('Name', '')) || 0;
      if (!nameGroups[index]) {
        nameGroups[index] = [];
      }
      nameGroups[index].push(input.value);
    });

    // Store the first encountered role input value for each numerical index.
    const roleValues = {};
    roleInputs.forEach(input => {
      const index = parseInt(input.name.replace('role', '')) || 0;
      if (!roleValues[index]) {
        roleValues[index] = input.value;
      }
    });

    // Get sorted indices of name groups.
    const indices = Object.keys(nameGroups).map(Number).sort((a, b) => a - b);

    // Create the zipped array.
    const zippedData = indices.map(index => {
      return {
        names: nameGroups[index] || [],
        role: roleValues[index] || ''
      };
    });

    // Create a fragment to hold all the new elements before inserting them
    const fragment = document.createDocumentFragment();

    zippedData.forEach(data => {
      let namesHTML = '';
      const uniqueNames = [...new Set(data.names)]; // Remove duplicate names

      uniqueNames.forEach((name, nameIndex) => {
        namesHTML += `<span style="font-weight: bold; min-height: 14pt; font-size: 14pt; text-decoration: underline;">${name}</span>`;

                      <span style="font-weight: bold; min-height: 14pt; font-size: 14pt; margin-right: 25%; text-align: left"> </span>`;
        }
      });

      // Create and append the names paragraph
      const namesParagraph = document.createElement('p');
      namesParagraph.style.width = '100%';
      namesParagraph.style.textAlign = 'justify';
      namesParagraph.innerHTML = namesHTML;
      fragment.appendChild(namesParagraph);

      // Create and append the roles paragraph
      const rolesParagraph = document.createElement('p');
      rolesParagraph.style.textAlign = 'justify';
      rolesParagraph.innerHTML = `
      <span style="min-height: 14pt; font-size: 14pt; margin-right: 25%; text-align: right"> </span>
      <span style="min-height: 14pt; font-size: 14pt;">${data.role}</span>
      <span style="min-height: 14pt; font-size: 14pt; margin-right: 25%; text-align: right"></span>
      <span style="min-height: 14pt; font-size: 14pt;">${data.role}</span>
    `;
      fragment.appendChild(rolesParagraph);

      // Create and append the empty paragraphs
      const emptyParagraph1 = document.createElement('p');
      emptyParagraph1.style.textAlign = 'justify';
      fragment.appendChild(emptyParagraph1);

      const emptyParagraph2 = document.createElement('p');
      emptyParagraph2.style.marginRight = '-44pt';
      emptyParagraph2.style.textAlign = 'justify';
      fragment.appendChild(emptyParagraph2);
    });

    // Insert the fragment containing all the new elements after the button
    buttonParentNode.parentNode.insertBefore(fragment, buttonParentNode.nextSibling);

    console.log(zippedData);
    // return zippedData; // Removed the return, as per your original code
  }

    if (container) {
      const htmlContent = container.outerHTML;
      console.log(htmlContent);

      const params = new URLSearchParams();
      // TODO: Check that all form fields have values, throw an error if that's not the case
      params.append('html', replaceFormValues());

      fetch('/document/generate', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: params,
      })
        .then(response => {
          if (response.ok) {
          }
        })
        .then(data => {
          console.log('Success:', data);
        })
        .catch((error) => {
          console.error('Error:', error);
          alert("An error occurred while saving the template."); // Alert user on error
        });
    } else {
      console.error("Element not found!");
    }
  }

  /**
   * Replaces form controls within an HTML string with their corresponding values.
   *
   * This function takes the HTML content of an article element, clones it to avoid
   * modifying the original DOM, and then iterates through all form elements (input,
   * select, textarea) within the cloned article.  It extracts the current value
   * of each form element and replaces the element itself with a text node containing
   * the value.  If a form element has no value, it is removed.
   *
   * @returns {string} The modified HTML string with form controls replaced by their values.
   *                   Returns the innerHTML of the modified article element.
   *
   * @example
   * // Assuming you have an article element with id "myArticle"
   * const originalHtml = document.getElementById('myArticle').innerHTML;
   * const newHtml = replaceFormValues(); // No need to pass the HTML string anymore.
   * document.getElementById('myArticle').innerHTML = newHtml; // Update the original element
   *
   * // Example HTML (before):
   * // <article>
   * //   <input type="text" value="Initial Text">
   * //   <select>...</select>
   * // </article>
   *
   * // Example HTML (after, assuming the text input was changed to "New Text" and a select option was chosen):
   * // <article>
   * //   New Text
   * //   [Selected Option Value]
   * // </article>
   */
  function replaceFormValues() {
    // clone the article to not modify the original HTML
    let art = document.getElementsByTagName('article')[0].cloneNode(true);

    const formElements = art.querySelectorAll('input, select, textarea');
    console.log(formElements);

    formElements.forEach(element => {
      const tagName = element.tagName.toLowerCase();
      let value = '';

      switch (tagName) {
        case 'input':
          const type = element.type.toLowerCase();
          if (type === 'text') {
            value = element.value;
          } else if (type === 'radio' || type === 'checkbox') {
            value = element.checked ? element.value : ''; // Handle checked state
          }
          break;
        case 'select':
          value = element.options[element.selectedIndex]?.value || ''; // Safe navigation for selected option
          break;
        case 'textarea':
          value = element.value;
          break;
      }

      // Replace the element with its value in the HTML string.
      if (value) {
        const placeholder = document.createTextNode(value);
        element.replaceWith(placeholder);
      } else {
        element.remove(); // if no value remove the element
      }
    });

    return art.outerHTML;
  }


  /**
 * Opens the customer selection modal and loads customer data if it hasn't been loaded yet.
 *
 * @param {string} elementId The ID of the "Agregar" button that triggered the modal.
 */
  function openCustomerSelectionModal(elementId) {
    // Store the ID of the clicked "Agregar" button for later use.
    openCustomerSelectionModal.agregarButtonId = elementId;
    // Load customer data if needed and then show the modal.
    loadCustomersIfNeeded(elementId, () => {
      showCustomerModal();
    });
  }

  /**
   * Flag to track if customer data has been loaded.
   * @type {boolean}
   */
  let customersLoaded = false;

  /**
   * Bootstrap modal instance for customer selection.
   * @type {bootstrap.Modal|null}
   */
  let customerModal = null;

  /**
   * Loads customer data from the server if it hasn't been loaded already.
   *
   * @param {string} elementId The ID of the "Agregar" button that triggered the modal.
   * @param {function} callback Function to be executed after customer data is loaded.
   */
  function loadCustomersIfNeeded(elementId, callback) {
    // If customer data is already loaded, execute the callback and return.
    if (customersLoaded) {
      callback();
      return;
    }

    // Fetch customer data from the server.
    fetch('/customers/json')
      .then(response => response.json())
      .then(data => {
        // Render the customer grid with the fetched data.
        renderCustomerGrid(data);
        // Initialize the customer modal.
        initializeCustomerModal();
        // Set the flag to indicate that customer data has been loaded.
        customersLoaded = true;
        // Execute the callback.
        callback();
        // Setup event listeners for customer selection.
        setupCustomerSelection();
      })
      .catch(error => console.error("Error:", error));
  }

  /**
   * Renders the customer grid using Grid.js.
   *
   * @param {Array} customers Array of customer objects.
   */
  function renderCustomerGrid(customers) {
    // Map customer data to the format required by Grid.js.
    const gridData = customers.map(customer => [
      `${customer.Name} ${customer.LastName}`,
      gridjs.html(`<button class="btn btn-sm btn-primary log-button" id=${customer.ID} data-customer='${JSON.stringify(customer)}' data-target-element-id="customer-selection-button-${customer.ID}">Selecionar</button>`)
    ]);

    // Render the grid.
    new gridjs.Grid({
      columns: ["Name", "Actions"],
      data: gridData,
      search: true,
    }).render(document.getElementById("customer-grid"));
  }

  /**
   * Initializes the Bootstrap modal for customer selection.
   */
  function initializeCustomerModal() {
    // Create a new Bootstrap modal instance if it doesn't exist.
    if (!customerModal) {
      customerModal = new bootstrap.Modal(document.getElementById('customerModal'));
    }
  }

  /**
   * Sets up event listeners for customer selection buttons in the grid.
   */
  function setupCustomerSelection() {
    // Get the grid element.
    const seleccionarButton = document.getElementById('customer-grid');

    // Add a click event listener to the grid.
    seleccionarButton.addEventListener('click', event => {
      // If the clicked element is a "Seleccionar" button, handle the selection.
      if (event.target.classList.contains('log-button')) {
        handleCustomerSelection(event);
      }
    });
  }

  /**

   *
   * @param {Event} event The click event.
   */

    // Extract customer data from the clicked button.
    const targetElementId = event.target.dataset.targetElementId;
    const customerData = JSON.parse(event.target.dataset.customer);
    const customerId = targetElementId.replace("customer-selection-button-", "");

    console.log("Customer Data:", customerData);
    console.log("Target Customer ID:", customerId);

    // Find the "Agregar" button that triggered the modal.
    const agregarButtonDiv = document.getElementById(openCustomerSelectionModal.agregarButtonId);

    if (agregarButtonDiv) {
      // Get the correct index for repString.
      const idx = openCustomerSelectionModal.agregarButtonId.replace("a-", "");
      // Create form controls with customer data.
      const formControls = createFormControls(repString[idx], customerData);
      // Create a delete button.
      const deleteButton = createDeleteButton();
      // Append the delete button to the form controls.
      formControls.appendChild(deleteButton);
      // Insert the form controls before the "Agregar" button's div.
      agregarButtonDiv.insertBefore(formControls, agregarButtonDiv.lastChild);
    } else {
      console.error("Agregar button div not found.");
    }
    // Hide the customer selection modal.
    customerModal.hide();
  }

  /**
   * Creates form controls based on the given HTML string and customer data.
   *

  /**
 * Synchronizes the values of input fields whose name attribute starts with "role".
 * When an input field loses focus (blur event), this function updates the values
 * of all other input fields with the exact same name to match the changed value.
 *
 * @function syncRoleInputs
 * @returns {void}
 *
 * @example
 * // Call the function to enable the synchronization:
 * syncRoleInputs();
 *
 * // HTML Example:
 * // <input type="text" name="role1" />
 * // <input type="text" name="role1" />
 * // <input type="text" name="role2" />
 * // <input type="text" name="role2" />
 */
  function syncRoleInputs() {
    // Select all input elements whose name attribute starts with "role" using a CSS selector.
    // The ^= operator means "starts with".
    const roleInputs = document.querySelectorAll('input[name^="role"]');

    // Iterate over each selected input element.
    roleInputs.forEach(input => {
      // Attach an 'blur' event listener to each input.
      input.addEventListener('blur', function () {
        // Get the name attribute of the input that triggered the event.
        const currentName = this.name;
        // Get the current value of the input that triggered the event.
        const currentValue = this.value;

        // Iterate over all roleInputs again to find other inputs with the same name.
        roleInputs.forEach(otherInput => {
          // Check if the otherInput is not the current input and if it has the same name.
          if (otherInput !== this && otherInput.name === currentName) {
            // Update the value of the otherInput to match the currentValue.
            otherInput.value = currentValue;
          }
        });
      });
    });
  }

    syncRoleInputs();
  }, 50);
