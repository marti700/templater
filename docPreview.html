<div class="hstack p-2 gap-2 bg-light">
  <button id="confirm" onclick="requestDocumentgeneration()" class="btn btn-primary px-4">Confirmar</button>
  <button id="cancel" class="btn btn-secondary px-4">Cancelar</button>
</div>

<div class="flex-grow-1 d-flex flex-row" style="height: 0;">
  <details class="docx-thumbnails h-100">
    <summary></summary>
    <div id="thumbnails-container" class="docx-thumbnails-container"></div>
  </details>
  <div id="document-container" class="overflow-auto flex-grow-1 h-100">
    {{.Template}}
  </div>
</div>

<script>
  let repString = {};
  let repeatedID = 1;
  let currentDocument = null;

  /// =========================
  /// BUTTON KUNG-FU
  /// =========================

  function fixedString() {
    let article = document.getElementsByTagName("article")[0].innerHTML;

    let repeatStart = article.indexOf('[repeat[[');
    let repeatEnd = article.indexOf(']]]');
    let repeatString = article.substring(repeatStart + 9, repeatEnd);
    // let fixedString = ''

    if (repeatString.indexOf("</") == 0) {
      let closingTag = repeatString.indexOf(">")
      repeatString = repeatString.substring(closingTag + 1)
    }

    const repeatEndIdx = article.indexOf('<', article.indexOf(']]]'))

    if (article[repeatEndIdx + 1] == '/') {
      console.log(repeatEndIdx)
      console.log(repeatString);
      let missing = article.substring(article.indexOf(']]]') + 3, article.indexOf('>', repeatEndIdx) + 1);
      console.log(missing);
      // fixedString = fixedString + fixedString.substring(article.indexOf(']]]')+3, article.indexOf('>', repeatEndIdx)+1);
      repeatString = repeatString + missing;
      console.log(repeatString);
    }

    article = article.replace('[repeat[[', '');
    article = article.replace(']]]', '');

    const replaceIndexStart = article.indexOf(repeatString);
    console.log(replaceIndexStart);
    console.log('============');
    console.log(repeatString);
    console.log('============');

    return repeatString;
  }

  function insertButton() {
    // article = article.replace(repeatString, `<div><button onclick="this.parentElement.innerHTML = '${repeatString.replace(/'/g, "\\'")}';">Agregar</button></div>`);

    let documentContainer = document.getElementsByTagName("article")[0]
    let mutatedDoc = documentContainer.innerHTML;
    let repeatString = fixedString();

    mutatedDoc = mutatedDoc.replace('[repeat[[', '');
    mutatedDoc = mutatedDoc.replace(']]]', '');
    let buttonHtml = `<div id='a-${repeatedID}'><button onclick="replaceHTML('a-${repeatedID}')">Agregar</button></div>`
    repString[repeatedID] = `<div> ${repeatString} </div> ${buttonHtml}`;
    repeatedID++;
    // return mutatedDoc.replaceAll(repeatString, `<div><button id='a1' onclick="replaceHTML('a1')">Agregar</button></div>`);
    documentContainer.innerHTML = mutatedDoc.replaceAll(repeatString, buttonHtml);
  }

  function replaceHTML(elementId) {
    let idx = elementId.split('-')[1];
    elem = document.getElementById(elementId);
    elem.outerHTML = replaceCurlyBracesWithFormControls(repString[idx])
  }
  /// =========================
  /// BUTTON KUNG-FU END
  /// =========================


  /// ==================================
  /// FORM CONTROLS DOM INSERTION START
  /// ==================================

  function replaceCurlyBracesWithFormControls(htmlString) {
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = htmlString;

    const elementsWithCurlyBraces = tempDiv.querySelectorAll('*');

    elementsWithCurlyBraces.forEach(element => {
      // Get all text nodes within the element
      const textNodes = Array.from(element.childNodes).filter(node => node.nodeType === Node.TEXT_NODE);

      textNodes.forEach(textNode => {
        let text = textNode.textContent;
        let match;
        let newNodes = [];

        // Regular expression to find text within curly braces with optional attributes
        const regex = /\{([^:]+):(input|drop);?([^}]*)\}/g;

        let lastIndex = 0;
        while ((match = regex.exec(text)) !== null) {
          const fullMatch = match[0];
          const fieldName = match[1];
          const inputType = match[2];
          const attributesString = match[3];
          let attributes = {};

          if (attributesString) {
            const attributePairs = attributesString.split(';');
            attributePairs.forEach(pair => {
              const [key, value] = pair.split('=');
              if (key && value) {
                attributes[key.trim()] = value.trim();
              }
            });
          }

          // Add the text before the match
          if (match.index > lastIndex) {
            newNodes.push(document.createTextNode(text.substring(lastIndex, match.index)));
          }

          let inputElement;
          if (inputType === "input") {
            inputElement = document.createElement('input');
            inputElement.type = 'text';
            inputElement.name = fieldName;
            inputElement.id = fieldName;
            for (const key in attributes) {
              inputElement.setAttribute(key, attributes[key]);
            }
          } else if (inputType === "drop") {
            inputElement = document.createElement('select');
            inputElement.name = fieldName;
            inputElement.id = fieldName;
            const options = attributesString.split(';');
            options.forEach(optionText => {
              const option = document.createElement('option');
              option.value = optionText;
              option.text = optionText;
              inputElement.appendChild(option);
            });
          }

          newNodes.push(inputElement);
          lastIndex = match.index + fullMatch.length;
        }

        // Add any remaining text after the last match
        if (lastIndex < text.length) {
          newNodes.push(document.createTextNode(text.substring(lastIndex)));
        }

        // Replace the original text node with the new nodes
        if (newNodes.length > 0) {
          element.replaceChild(newNodes[0], textNode);
          newNodes.slice(1).forEach(newNode => {
            element.insertBefore(newNode, newNodes[0].nextSibling);
          });
        }
      });
    });

    return tempDiv.innerHTML;
  }

  /// ==================================
  /// FORM CONTROLS DOM INSERTION END
  /// ==================================

  /// =================================
  // SEND DOCUMENT TO THE SERVER START
  /// =================================
  function requestDocumentgeneration() {
    const container = document.getElementsByTagName('article')[0];

    if (container) {
      const htmlContent = container.innerHTML;

      const params = new URLSearchParams();
      params.append('html', htmlContent);

      fetch('/document/generate', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: params,
      })
        .then(response => {
          if (response.ok) {
          }
        })
        .then(data => {
          console.log('Success:', data);
        })
        .catch((error) => {
          console.error('Error:', error);
          alert("An error occurred while saving the template."); // Alert user on error
        });
    } else {
      console.error("Element not found!");
    }
  }

  /// =================================
  // SEND DOCUMENT TO THE SERVER END
  /// =================================


  setTimeout(() => {
    insertButton(); // insert the button for the repeat text
    document.body.innerHTML = replaceCurlyBracesWithFormControls(document.body.innerHTML);
  }, 50);

</script>
